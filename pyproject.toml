[project]
name = "depot-server"
version = "1.3.0"
description = "Backend service for the jdav equipment depot service"
authors = [
    { name = "Lukas Voegtle", email = "lukas@infornautik.de" },
    { name = "Andreas Philipp", email = "andi@anphi.de"}]

requires-python = ">=3.12"
dependencies = [
    "pydantic>=2, <3",
    "fastapi[standard]>=0.115",
    "motor>=3,<4",
    "oyaml>=1,<2",
    "authlib>=1,<2",
    "pytz~=2025.2",
    "uvicorn>=0.34,<0.35",
    "httpx>=0.28,<0.29",
    "mako>=1,<2",
    "aiosmtplib>=4,<5",
    "python-multipart>=0.0.26,<0.1",
    "pillow>=11,<12",
]

[project.scripts]
migrate = "depot_server.db.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-mypy>=1,<2",
    "pytest-flake8>=1,<2",
    "requests>=2,<3",
    "mongomock>=4,<5",
    "types-pytz>=2025,<2026",
    "types-requests>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "util/hatchling_git_hook.py"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.sdist.force-include]
"build/version.py" = "src/depot_server/dynamic_version.py"
