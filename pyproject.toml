[project]
name = "depot-server"
version = "1.3.0"
description = "Backend service for the jdav equipment depot service"
authors = [
    { name = "Lukas Voegtle", email = "lukas@infornautik.de" },
    { name = "Andreas Philipp", email = "andi@anphi.de"}]

requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=4,<5",
    "authlib>=1,<2",
    "fastapi[standard]>=0.115",
    "httpx>=0.28,<0.29",
    "mako>=1,<2",
    "motor>=3,<4",
    "oyaml>=1,<2",
    "pydantic>=2, <3",
    "pillow>=12,<13",
    "python-multipart>=0.0,<0.1",
    "pytz~=2025.2",
    "tortoise-orm[asyncpg, accel]==1.1.3",
    "uvicorn>=0.34,<0.35",
]

[project.scripts]
migrate = "depot_server.db.migrate:main"

[dependency-groups]
dev = [
    "mongomock>=4,<5",
    "pytest>=9,<10",
    "pytest-flake8>=1,<2",
    "pytest-mypy>=1,<2",
    "requests>=2,<3",
    "types-pytz>=2025,<2026",
    "types-requests>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.tortoise]
tortoise_orm = "depot_server.config.TORTOISE_ORM"

[tool.tortoise.apps.models]
models = ["depot_server.models"]
default_connection = "default"
migrations = "depot_server.db2.migrations"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "util/hatchling_git_hook.py"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.sdist.force-include]
"build/version.py" = "src/depot_server/dynamic_version.py"
